<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Look dos Advérbios: Ateliê de Estilo Gramatical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 50%, #e0e7ff 100%);
            min-height: 100vh;
        }
        h1, h2, h3, .font-title {
            font-family: 'Fredoka', sans-serif;
        }
        .card-hanger {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hanger:hover {
            transform: translateY(-4px) scale(1.02);
        }
        .card-selected {
            ring: 4px solid #db2777;
            background-color: #fce7f3;
            transform: scale(1.04);
        }
        .word-chip {
            transition: all 0.2s;
            cursor: pointer;
        }
        .word-chip:hover {
            background-color: #f3e8ff;
            transform: translateY(-2px);
        }
        .word-selected {
            background-color: #fde047 !important;
            color: #713f12 !important;
            font-weight: 800;
            box-shadow: 0 2px 0 #ca8a04;
        }
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .animate-mannequin {
            animation: pulse-soft 3s infinite ease-in-out;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #certificate-area, #certificate-area * {
                visibility: visible;
            }
            #certificate-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
